    <animate attributeName="stroke-dashoffset" from="0" to="30" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <path d="M520 340 L380 400" stroke="#00aa00" stroke-width="2" stroke-dasharray="10,5">
    <animate attributeName="stroke-dashoffset" from="0" to="30" dur="1.3s" repeatCount="indefinite"/>
  </path>
  
  <path d="M520 360 L220 450" stroke="#00aa00" stroke-width="2" stroke-dasharray="10,5">
