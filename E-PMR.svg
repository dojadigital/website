<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background with subtle grid -->
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
    
    <!-- QR Code Symbol Template -->
    <g id="qrSymbol">
      <rect x="-15" y="-15" width="30" height="30" fill="white" stroke="#333" stroke-width="1"/>
      <rect x="-10" y="-10" width="6" height="6" fill="#333"/>
      <rect x="4" y="-10" width="6" height="6" fill="#333"/>
      <rect x="-10" y="4" width="6" height="6" fill="#333"/>
      <rect x="4" y="4" width="6" height="6" fill="#333"/>
    </g>
    
    <!-- Mobile Phone Symbol -->
    <symbol id="mobilePhone" viewBox="0 0 60 100">
      <rect x="5" y="5" width="50" height="90" rx="5" fill="#333"/>
      <rect x="8" y="15" width="44" height="70" rx="2" fill="#fff"/>
      <circle cx="30" cy="95" r="5" fill="#555"/>
      <circle cx="30" cy="10" r="2" fill="#555"/>
    </symbol>
    
    <!-- Tablet Symbol -->
    <symbol id="tablet" viewBox="0 0 120 80">
      <rect x="5" y="5" width="110" height="70" rx="5" fill="#333"/>
      <rect x="8" y="8" width="104" height="64" rx="2" fill="#fff"/>
      <circle cx="60" cy="75" r="3" fill="#555"/>
    </symbol>
    
    <!-- Hospital Bed Symbol -->
    <symbol id="hospitalBed" viewBox="0 0 150 80">
      <rect x="10" y="50" width="130" height="20" rx="2" fill="#7985a3"/>
      <rect x="10" y="40" width="130" height="10" rx="1" fill="#a4b0cc"/>
      <rect x="20" y="30" width="110" height="10" rx="5" fill="#c6d1e7"/>
      <line x1="20" y1="70" x2="20" y2="80" stroke="#556080" stroke-width="3"/>
      <line x1="130" y1="70" x2="130" y2="80" stroke="#556080" stroke-width="3"/>
      <rect x="10" y="20" width="20" height="20" rx="2" fill="#a4b0cc"/>
    </symbol>
    
    <!-- Healthcare Worker Symbol -->
    <symbol id="healthcareWorker" viewBox="0 0 50 100">
      <circle cx="25" cy="20" r="15" fill="#5ecbf2"/>
      <path d="M25 5 Q40 5, 40 20 Q40 35, 25 35 Q10 35, 10 20 Q10 5, 25 5" fill="#f96d00"/>
      <rect x="15" y="35" width="20" height="45" rx="5" fill="#153b75"/>
      <rect x="10" y="40" width="30" height="7" rx="3" fill="#153b75"/>
      <rect x="10" y="45" width="10" height="25" rx="3" fill="#f96d00"/>
      <rect x="30" y="45" width="10" height="25" rx="3" fill="#f96d00"/>
      <rect x="15" y="80" width="8" height="20" rx="2" fill="#333"/>
      <rect x="27" y="80" width="8" height="20" rx="2" fill="#333"/>
    </symbol>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Central Hub - Hospital System -->
  <circle cx="400" cy="250" r="80" fill="#f0f8ff" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="245" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Hospital Data</text>
  <text x="400" y="265" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">System</text>
  
  <!-- QR Code in Central Hub -->
  <g transform="translate(400, 210)">
    <use href="#qrSymbol"/>
  </g>
  
  <!-- Patient Station - Left -->
  <g class="patient-station">
    <rect x="80" y="150" width="150" height="200" rx="10" fill="#e8f4fc" stroke="#2980b9" stroke-width="2"/>
    <text x="155" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Patient Check-in</text>
    
    <!-- Hospital Bed -->
    <use href="#hospitalBed" x="95" y="210" width="120" height="60"/>
    
    <!-- Patient QR -->
    <g transform="translate(155, 240)">
      <circle cx="0" cy="0" r="25" fill="white" stroke="#2980b9" stroke-width="2"/>
      <use href="#qrSymbol" transform="scale(0.9)"/>
      <text x="0" y="35" font-family="Arial" font-size="12" text-anchor="middle">Patient</text>
    </g>
    
    <!-- Healthcare Worker -->
    <use href="#healthcareWorker" x="95" y="240" width="40" height="80"/>
    
    <!-- Scanner animation -->
    <rect x="130" y="230" width="50" height="2" fill="#27ae60" opacity="0.8">
      <animate attributeName="y" from="220" to="260" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Medical Equipment - Right Top -->
  <g class="equipment-tracking">
    <rect x="570" y="100" width="150" height="150" rx="10" fill="#e8f4fc" stroke="#2980b9" stroke-width="2"/>
    <text x="645" y="130" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Equipment Tracking</text>
    
    <!-- Equipment Carts -->
    <rect x="590" y="150" width="50" height="70" rx="5" fill="#a4b0cc"/>
    <rect x="650" y="150" width="50" height="70" rx="5" fill="#a4b0cc"/>
    <circle cx="600" cy="220" r="5" fill="#333"/>
    <circle cx="630" cy="220" r="5" fill="#333"/>
    <circle cx="660" cy="220" r="5" fill="#333"/>
    <circle cx="690" cy="220" r="5" fill="#333"/>
    
    <!-- Equipment QR Codes -->
    <g transform="translate(615, 175)">
      <circle cx="0" cy="0" r="18" fill="white" stroke="#2980b9" stroke-width="2"/>
      <use href="#qrSymbol" transform="scale(0.7)"/>
    </g>
    
    <g transform="translate(675, 175)">
      <circle cx="0" cy="0" r="18" fill="white" stroke="#2980b9" stroke-width="2"/>
      <use href="#qrSymbol" transform="scale(0.7)"/>
    </g>
    
    <text x="615" y="205" font-family="Arial" font-size="10" text-anchor="middle">Asset</text>
    <text x="675" y="205" font-family="Arial" font-size="10" text-anchor="middle">Product</text>
  </g>
  
  <!-- Mobile Scanning - Right Bottom -->
  <g class="mobile-scanning">
    <rect x="570" y="300" width="150" height="150" rx="10" fill="#e8f4fc" stroke="#2980b9" stroke-width="2"/>
    <text x="645" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Mobile Scanning</text>
    
    <!-- Mobile Device -->
    <use href="#mobilePhone" x="600" y="350" width="40" height="80"/>
    
    <!-- Tablet Device -->
    <use href="#tablet" x="650" y="370" width="60" height="40"/>
    
    <!-- QR on Screen -->
    <g transform="translate(620, 390)">
      <use href="#qrSymbol" transform="scale(0.5)"/>
    </g>
    
    <g transform="translate(680, 390)">
      <use href="#qrSymbol" transform="scale(0.5)"/>
    </g>
  </g>
  
  <!-- Admin Station - Left Bottom -->
  <g class="admin-station">
    <rect x="80" y="380" width="150" height="100" rx="10" fill="#e8f4fc" stroke="#2980b9" stroke-width="2"/>
    <text x="155" y="410" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Admin Station</text>
    
    <!-- Computer -->
    <rect x="120" y="430" width="70" height="40" rx="2" fill="#333"/>
    <rect x="125" y="435" width="60" height="30" rx="1" fill="#fff"/>
    <rect x="145" y="470" width="20" height="5" fill="#333"/>
    
    <!-- Admin QR -->
    <g transform="translate(155, 450)">
      <use href="#qrSymbol" transform="scale(0.6)"/>
    </g>
  </g>
  
  <!-- Caregiver Station - Top -->
  <g class="caregiver-station">
    <rect x="250" y="50" width="300" height="100" rx="10" fill="#e8f4fc" stroke="#2980b9" stroke-width="2"/>
    <text x="400" y="80" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Caregiver Station</text>
    
    <!-- Healthcare Workers -->
    <use href="#healthcareWorker" x="300" y="70" width="30" height="70"/>
    <use href="#healthcareWorker" x="350" y="70" width="30" height="70"/>
    <use href="#healthcareWorker" x="400" y="70" width="30" height="70"/>
    <use href="#healthcareWorker" x="450" y="70" width="30" height="70"/>
    
    <!-- Caregiver QR Codes -->
    <g transform="translate(315, 120)">
      <circle cx="0" cy="0" r="15" fill="white" stroke="#2980b9" stroke-width="2"/>
      <use href="#qrSymbol" transform="scale(0.6)"/>
    </g>
    
    <g transform="translate(365, 120)">
      <circle cx="0" cy="0" r="15" fill="white" stroke="#2980b9" stroke-width="2"/>
      <use href="#qrSymbol" transform="scale(0.6)"/>
    </g>
    
    <g transform="translate(415, 120)">
      <circle cx="0" cy="0" r="15" fill="white" stroke="#2980b9" stroke-width="2"/>
      <use href="#qrSymbol" transform="scale(0.6)"/>
    </g>
    
    <g transform="translate(465, 120)">
      <circle cx="0" cy="0" r="15" fill="white" stroke="#2980b9" stroke-width="2"/>
      <use href="#qrSymbol" transform="scale(0.6)"/>
    </g>
  </g>
  
  <!-- Data Flow Animations -->
  <!-- Patient to Hub -->
  <path d="M200 250 Q300 200, 325 250" fill="none" stroke="#3498db" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Hub to Patient -->
  <path d="M325 260 Q300 310, 200 260" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="3.2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Equipment to Hub -->
  <path d="M580 175 Q490 175, 460 220" fill="none" stroke="#3498db" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2.8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Hub to Equipment -->
  <path d="M460 230 Q490 275, 580 230" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="3.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Mobile to Hub -->
  <path d="M580 380 Q515 370, 460 310" fill="none" stroke="#3498db" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="3.2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Hub to Mobile -->
  <path d="M460 290 Q515 320, 580 350" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2.7s" repeatCount="indefinite"/>
  </path>
  
  <!-- Admin to Hub -->
  <path d="M200 390 Q250 350, 350 290" fill="none" stroke="#3498db" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="3.3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Hub to Admin -->
  <path d="M350 280 Q250 320, 200 400" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Caregiver to Hub -->
  <path d="M400 150 L400 170" fill="none" stroke="#3498db" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Hub to Caregiver -->
  <path d="M410 170 L410 150" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1.8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Pulse Animations for QR Codes -->
  <circle cx="155" cy="240" r="28" fill="none" stroke="#27ae60" stroke-width="2">
    <animate attributeName="r" values="25;30;25" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="615" cy="175" r="21" fill="none" stroke="#27ae60" stroke-width="2">
    <animate attributeName="r" values="18;23;18" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="675" cy="175" r="21" fill="none" stroke="#27ae60" stroke-width="2">
    <animate attributeName="r" values="18;23;18" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central Hub Pulse -->
  <circle cx="400" cy="250" r="85" fill="none" stroke="#3498db" stroke-width="2">
    <animate attributeName="r" values="80;90;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Mobile Devices Screen Flicker -->
  <rect x="608" y="365" width="25" height="40" fill="#27ae60" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="657" y="378" width="45" height="25" fill="#27ae60" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Admin Computer Screen Flicker -->
  <rect x="125" y="435" width="60" height="30" fill="#27ae60" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Scanning animations -->
  <rect x="610" y="175" width="10" height="2" fill="#27ae60" opacity="0.8">
    <animate attributeName="y" from="165" to="185" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="670" y="175" width="10" height="2" fill="#27ae60" opacity="0.8">
    <animate attributeName="y" from="165" to="185" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Data packets traveling along paths -->
  <circle cx="0" cy="0" r="5" fill="#3498db">
    <animateMotion path="M200 250 Q300 200, 325 250" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="5" fill="#e74c3c">
    <animateMotion path="M325 260 Q300 310, 200 260" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="5" fill="#3498db">
    <animateMotion path="M580 175 Q490 175, 460 220" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="5" fill="#e74c3c">
    <animateMotion path="M460 230 Q490 275, 580 230" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="5" fill="#3498db">
    <animateMotion path="M580 380 Q515 370, 460 310" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="5" fill="#e74c3c">
    <animateMotion path="M460 290 Q515 320, 580 350" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="5" fill="#3498db">
    <animateMotion path="M200 390 Q250 350, 350 290" dur="3.3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="5" fill="#e74c3c">
    <animateMotion path="M350 280 Q250 320, 200 400" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="5" fill="#3498db">
    <animateMotion path="M400 150 L400 170" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="5" fill="#e74c3c">
    <animateMotion path="M410 170 L410 150" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
