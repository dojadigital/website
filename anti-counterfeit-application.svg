<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Definitions for reusable elements -->
  <defs>
    <!-- Patterns and gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a365d"/>
      <stop offset="100%" stop-color="#2c5282"/>
    </linearGradient>
    
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    
    <!-- QR Code symbol -->
    <symbol id="qrCode" viewBox="0 0 50 50">
      <rect width="50" height="50" fill="white" stroke="#333" stroke-width="1"/>
      <rect x="5" y="5" width="10" height="10" fill="#333"/>
      <rect x="35" y="5" width="10" height="10" fill="#333"/>
      <rect x="5" y="35" width="10" height="10" fill="#333"/>
      <rect x="20" y="5" width="5" height="5" fill="#333"/>
      <rect x="30" y="10" width="5" height="5" fill="#333"/>
      <rect x="20" y="15" width="5" height="5" fill="#333"/>
      <rect x="25" y="20" width="5" height="5" fill="#333"/>
      <rect x="35" y="20" width="5" height="5" fill="#333"/>
      <rect x="10" y="20" width="5" height="5" fill="#333"/>
      <rect x="15" y="25" width="5" height="5" fill="#333"/>
      <rect x="5" y="25" width="5" height="5" fill="#333"/>
      <rect x="30" y="30" width="5" height="5" fill="#333"/>
      <rect x="20" y="30" width="5" height="5" fill="#333"/>
      <rect x="35" y="35" width="5" height="5" fill="#333"/>
      <rect x="25" y="40" width="5" height="5" fill="#333"/>
    </symbol>
    
    <!-- Secure badge symbol -->
    <symbol id="securityBadge" viewBox="0 0 50 60">
      <path d="M25,5 L5,15 L5,30 C5,40 15,50 25,55 C35,50 45,40 45,30 L45,15 L25,5 Z" fill="#48bb78" stroke="#2f855a" stroke-width="2"/>
      <path d="M20,30 L23,33 L33,23" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    
    <!-- Factory symbol -->
    <symbol id="factory" viewBox="0 0 100 80">
      <rect x="10" y="40" width="80" height="40" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/>
      <rect x="20" y="20" width="20" height="20" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/>
      <rect x="60" y="30" width="20" height="10" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/>
      <rect x="25" y="50" width="15" height="30" fill="#4a5568"/>
      <rect x="60" y="50" width="15" height="20" fill="#4a5568"/>
      <path d="M30,10 L40,20 L20,20 Z" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/>
      <rect x="75" y="60" width="10" height="10" fill="#f6ad55"/>
    </symbol>
    
    <!-- Warehouse symbol -->
    <symbol id="warehouse" viewBox="0 0 100 80">
      <path d="M10,40 L50,10 L90,40 L90,80 L10,80 Z" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/>
      <rect x="40" y="50" width="20" height="30" fill="#4a5568"/>
      <rect x="15" y="50" width="15" height="15" fill="#f6ad55"/>
      <rect x="70" y="50" width="15" height="15" fill="#f6ad55"/>
    </symbol>
    
    <!-- Store symbol -->
    <symbol id="store" viewBox="0 0 100 80">
      <path d="M10,30 L90,30 L90,80 L10,80 Z" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/>
      <path d="M5,30 L50,10 L95,30" fill="none" stroke="#4a5568" stroke-width="2"/>
      <rect x="40" y="50" width="20" height="30" fill="#4a5568"/>
      <rect x="20" y="40" width="15" height="15" fill="#90cdf4"/>
      <rect x="65" y="40" width="15" height="15" fill="#90cdf4"/>
    </symbol>
    
    <!-- Smartphone symbol -->
    <symbol id="smartphone" viewBox="0 0 50 80">
      <rect x="10" y="5" width="30" height="70" rx="3" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>
      <rect x="13" y="10" width="24" height="55" fill="#90cdf4"/>
      <circle cx="25" cy="70" r="3" fill="#a0aec0"/>
    </symbol>
    
    <!-- Analytics symbol -->
    <symbol id="analytics" viewBox="0 0 80 60">
      <rect x="5" y="5" width="70" height="50" rx="2" fill="white" stroke="#4a5568" stroke-width="1"/>
      <line x1="10" y1="45" x2="70" y2="45" stroke="#4a5568" stroke-width="1"/>
      <line x1="10" y1="10" x2="10" y2="45" stroke="#4a5568" stroke-width="1"/>
      <path d="M15,35 L25,20 L35,30 L45,15 L55,25 L65,10" fill="none" stroke="#3182ce" stroke-width="2"/>
      <circle cx="25" cy="20" r="2" fill="#3182ce"/>
      <circle cx="35" cy="30" r="2" fill="#3182ce"/>
      <circle cx="45" cy="15" r="2" fill="#3182ce"/>
      <circle cx="55" cy="25" r="2" fill="#3182ce"/>
      <circle cx="65" cy="10" r="2" fill="#3182ce"/>
    </symbol>
    
    <!-- Lock symbol -->
    <symbol id="lock" viewBox="0 0 40 50">
      <rect x="10" y="20" width="20" height="25" rx="2" fill="#e53e3e" stroke="#c53030" stroke-width="1"/>
      <path d="M15,20 L15,15 C15,10 20,10 20,10 C20,10 25,10 25,15 L25,20" fill="none" stroke="#c53030" stroke-width="2"/>
      <circle cx="20" cy="30" r="3" fill="#fff"/>
      <line x1="20" y1="30" x2="20" y2="38" stroke="#fff" stroke-width="2"/>
    </symbol>
    
    <!-- Loyalty symbol -->
    <symbol id="loyalty" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="25" fill="#ed8936" stroke="#dd6b20" stroke-width="2"/>
      <path d="M25,20 L35,20 L38,30 L30,35 L22,30 Z" fill="#fff"/>
      <circle cx="30" cy="17" r="3" fill="#fff"/>
      <circle cx="41" cy="30" r="3" fill="#fff"/>
      <circle cx="30" cy="43" r="3" fill="#fff"/>
      <circle cx="19" cy="30" r="3" fill="#fff"/>
    </symbol>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGradient)"/>
  <rect width="900" height="600" fill="url(#gridPattern)"/>
  
  <!-- Header -->
  <rect width="900" height="70" fill="url(#headerGradient)"/>
  <text x="450" y="45" font-family="Arial" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Anti-Counterfeit Application</text>
  
  <!-- Central Security Shield -->
  <g transform="translate(450, 180)">
    <circle cx="0" cy="0" r="80" fill="#ebf8ff" stroke="#bee3f8" stroke-width="3"/>
    <use href="#securityBadge" x="-40" y="-50" width="80" height="100"/>
    
    <!-- QR Code -->
    <g transform="translate(0, 8)">
      <use href="#qrCode" x="-17" y="-17" width="34" height="34"/>
      
      <!-- Scanning animation -->
      <rect x="-17" y="-8" width="34" height="2" fill="#38b2ac" opacity="0.7">
        <animate attributeName="y" from="-17" to="17" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Pulsing effect -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#4299e1" stroke-width="3" opacity="0.5">
      <animate attributeName="r" from="80" to="90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.5" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Supply Chain Elements -->
  <!-- Factory -->
  <g transform="translate(150, 320)">
    <circle cx="0" cy="0" r="55" fill="#e6fffa" stroke="#b2f5ea" stroke-width="2"/>
    <use href="#factory" x="-40" y="-35" width="80" height="70"/>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#2c7a7b" text-anchor="middle" font-weight="bold">Production</text>
    
    <!-- QR code on product -->
    <g transform="translate(30, 0) scale(0.5)">
      <use href="#qrCode" width="40" height="40"/>
    </g>
  </g>
  
  <!-- Warehouse -->
  <g transform="translate(320, 420)">
    <circle cx="0" cy="0" r="55" fill="#e6fffa" stroke="#b2f5ea" stroke-width="2"/>
    <use href="#warehouse" x="-40" y="-35" width="80" height="70"/>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#2c7a7b" text-anchor="middle" font-weight="bold">Distribution</text>
    
    <!-- QR code on package -->
    <g transform="translate(-20, 0) scale(0.5)">
      <use href="#qrCode" width="40" height="40"/>
    </g>
  </g>
  
  <!-- Store -->
  <g transform="translate(580, 420)">
    <circle cx="0" cy="0" r="55" fill="#e6fffa" stroke="#b2f5ea" stroke-width="2"/>
    <use href="#store" x="-40" y="-35" width="80" height="70"/>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#2c7a7b" text-anchor="middle" font-weight="bold">Retail</text>
    
    <!-- QR code on shelf -->
    <g transform="translate(20, 0) scale(0.5)">
      <use href="#qrCode" width="40" height="40"/>
    </g>
  </g>
  
  <!-- Consumer -->
  <g transform="translate(750, 320)">
    <circle cx="0" cy="0" r="55" fill="#e6fffa" stroke="#b2f5ea" stroke-width="2"/>
    <use href="#smartphone" x="-20" y="-35" width="40" height="70"/>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#2c7a7b" text-anchor="middle" font-weight="bold">Consumer</text>
  </g>
  
  <!-- Feature Boxes -->
  <!-- Authentication -->
  <g transform="translate(220, 180)">
    <rect x="-90" y="-50" width="180" height="100" rx="10" fill="white" stroke="#cbd5e0" stroke-width="2"/>
    <text x="0" y="-25" font-family="Arial" font-size="16" fill="#2d3748" text-anchor="middle" font-weight="bold">Authentication</text>
    <line x1="-70" y1="-15" x2="70" y2="-15" stroke="#edf2f7" stroke-width="2"/>
    
    <g transform="translate(-50, 15)">
      <use href="#qrCode" width="40" height="40"/>
      <circle cx="20" cy="20" r="25" fill="none" stroke="#48bb78" stroke-width="2">
        <animate attributeName="r" from="20" to="25" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="1" to="0.3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <g transform="translate(40, 15)">
      <use href="#securityBadge" width="30" height="40"/>
    </g>
    
    <line x1="-15" y1="20" x2="15" y2="20" stroke="#4299e1" stroke-width="2" stroke-dasharray="3,2">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Analytics -->
  <g transform="translate(450, 340)">
    <rect x="-80" y="-50" width="160" height="100" rx="10" fill="white" stroke="#cbd5e0" stroke-width="2"/>
    <text x="0" y="-25" font-family="Arial" font-size="16" fill="#2d3748" text-anchor="middle" font-weight="bold">Analytics</text>
    <line x1="-60" y1="-15" x2="60" y2="-15" stroke="#edf2f7" stroke-width="2"/>
    <use href="#analytics" x="-30" y="-5" width="60" height="45"/>
    
    <!-- Animated data point -->
    <circle cx="0" cy="0" r="3" fill="#3182ce">
      <animate attributeName="cx" values="-20;-10;0;10;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="15;5;10;0;10" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Geo-restriction -->
  <g transform="translate(680, 180)">
    <rect x="-90" y="-50" width="180" height="100" rx="10" fill="white" stroke="#cbd5e0" stroke-width="2"/>
    <text x="0" y="-25" font-family="Arial" font-size="16" fill="#2d3748" text-anchor="middle" font-weight="bold">Regional Locking</text>
    <line x1="-70" y1="-15" x2="70" y2="-15" stroke="#edf2f7" stroke-width="2"/>
    
    <circle cx="0" cy="10" r="30" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1"/>
    <path d="M-15,10 L-5,0 L15,20 L15,30 L-15,30 Z" fill="#4a5568"/>
    <path d="M15,10 L5,0 L-15,20 L-15,30 L15,30 Z" fill="#718096"/>
    
    <g transform="translate(25, 20)">
      <use href="#lock" width="20" height="25"/>
    </g>
    
    <!-- Map pin pulsing -->
    <circle cx="0" cy="10" r="5" fill="#e53e3e" opacity="0.5">
      <animate attributeName="r" from="5" to="10" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.5" to="0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="10" r="3" fill="#e53e3e"/>
  </g>
  
  <!-- Loyalty -->
  <g transform="translate(220, 520)">
    <rect x="-90" y="-50" width="180" height="100" rx="10" fill="white" stroke="#cbd5e0" stroke-width="2"/>
    <text x="0" y="-25" font-family="Arial" font-size="16" fill="#2d3748" text-anchor="middle" font-weight="bold">Loyalty Programs</text>
    <line x1="-70" y1="-15" x2="70" y2="-15" stroke="#edf2f7" stroke-width="2"/>
    
    <use href="#loyalty" x="-50" y="-10" width="40" height="40"/>
    <use href="#smartphone" x="25" y="-20" width="30" height="50"/>
    
    <!-- Animation of rewards transfer -->
    <path d="M-20,10 C0,0 0,20 20,10" fill="none" stroke="#ed8936" stroke-width="2" stroke-dasharray="4,2">
      <animate attributeName="stroke-dashoffset" from="0" to="12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    
    <circle cx="-20" cy="10" r="2" fill="#ed8936"/>
    <circle cx="20" cy="10" r="2" fill="#ed8936"/>
  </g>
  
  <!-- Supply Chain Tracking -->
  <g transform="translate(680, 520)">
    <rect x="-90" y="-50" width="180" height="100" rx="10" fill="white" stroke="#cbd5e0" stroke-width="2"/>
    <text x="0" y="-25" font-family="Arial" font-size="16" fill="#2d3748" text-anchor="middle" font-weight="bold">Supply Chain Visibility</text>
    <line x1="-70" y1="-15" x2="70" y2="-15" stroke="#edf2f7" stroke-width="2"/>
    
    <g transform="translate(-50, 0)">
      <rect x="-10" y="-10" width="20" height="20" fill="#a0aec0"/>
      <use href="#qrCode" x="-8" y="-8" width="16" height="16"/>
    </g>
    
    <g transform="translate(0, 0)">
      <rect x="-10" y="-10" width="20" height="20" fill="#a0aec0"/>
      <use href="#qrCode" x="-8" y="-8" width="16" height="16"/>
    </g>
    
    <g transform="translate(50, 0)">
      <rect x="-10" y="-10" width="20" height="20" fill="#a0aec0"/>
      <use href="#qrCode" x="-8" y="-8" width="16" height="16"/>
    </g>
    
    <line x1="-40" y1="0" x2="-10" y2="0" stroke="#4299e1" stroke-width="2"/>
    <line x1="10" y1="0" x2="40" y2="0" stroke="#4299e1" stroke-width="2"/>
    
    <!-- Package motion animation -->
    <rect x="-60" y="20" width="120" height="2" fill="#4299e1"/>
    <rect x="-55" y="18" width="10" height="6" fill="#a0aec0">
      <animate attributeName="x" from="-55" to="45" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Connection lines -->
  <!-- Central to Features -->
  <path d="M450,220 L300,180" stroke="#90cdf4" stroke-width="2" stroke-dasharray="5,3" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M450,220 L450,290" stroke="#90cdf4" stroke-width="2" stroke-dasharray="5,3" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M450,220 L600,180" stroke="#90cdf4" stroke-width="2" stroke-dasharray="5,3" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Supply Chain Connections -->
  <path d="M200,340 L320,380" stroke="#4299e1" stroke-width="2" stroke-dasharray="5,3" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M360,420 L540,420" stroke="#4299e1" stroke-width="2" stroke-dasharray="5,3" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M620,395 L710,345" stroke="#4299e1" stroke-width="2" stroke-dasharray="5,3" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Data Flow Animations -->
  <!-- Moving data packets -->
  <circle cx="0" cy="0" r="3" fill="#3182ce">
    <animateMotion path="M450,220 L300,180" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="3" fill="#3182ce">
    <animateMotion path="M450,220 L450,290" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="3" fill="#3182ce">
    <animateMotion path="M450,220 L600,180" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="3" fill="#38a169">
    <animateMotion path="M200,340 L320,380" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="3" fill="#38a169">
    <animateMotion path="M360,420 L540,420" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="0" cy="0" r="3" fill="#38a169">
    <animateMotion path="M620,395 L710,345" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Mobile phone scan animation -->
  <g transform="translate(750, 320)">
    <path d="M-5,-15 L15,15" stroke="#4299e1" stroke-width="1" stroke-dasharray="3,2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
